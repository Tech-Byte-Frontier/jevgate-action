name: Test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # catches a JevGate release that breaks the action
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Key kinds
        shell: bash
        run: bash test/key-kinds.sh
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A dry run needs no key or network access beyond the download, and
      # checks install, PATH, --base and the exit code.
      - id: jevgate
        uses: ./
        with:
          args: --dry-run
          cache: "false"
          sarif-file: jevgate.sarif
      - name: Check the outputs
        shell: bash
        env:
          CODE: ${{ steps.jevgate.outputs.exit-code }}
        run: |
          [ "$CODE" = 0 ] || { echo "::error::exit code $CODE"; exit 1; }
          jevgate --version
          grep -q '"version": "2.1.0"' jevgate.sarif || { echo "::error::no SARIF log"; exit 1; }
  incomplete:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A change whose answers no cache holds: --cache-only writes a report
      # and ends incomplete, with no key and nothing sent.
      - name: Create a repository to check
        shell: bash
        run: bash test/fixture-repository.sh fixture
      - id: jevgate
        uses: ./
        continue-on-error: true
        with:
          working-directory: fixture
          base: HEAD~1
          args: --cache-only
          cache: "false"
      - name: Check the outputs
        shell: bash
        env:
          CODE: ${{ steps.jevgate.outputs.exit-code }}
          REPORT: ${{ steps.jevgate.outputs.report }}
        run: |
          [ "$CODE" = 2 ] || { echo "::error::exit code $CODE"; exit 1; }
          # The path must open outside bash too, as upload-artifact opens it.
          node -e 'require("fs").accessSync(process.argv[1])' "$REPORT" || { echo "::error::no report at $REPORT"; exit 1; }
